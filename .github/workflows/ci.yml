name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

    steps:
      - uses: actions/checkout@v5

      - name: Bật corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Cài phụ thuộc
        run: yarn install --immutable

      # Tech Spec §8.1 — sáu công cụ, gộp trong một lệnh.
      - name: Verify
        run: yarn verify

      # Luật tầng §2.2–2.3 im lặng khi cấu hình hỏng, nên phải kiểm bằng file vi
      # phạm cố ý chứ không tin vào việc `yarn lint` xanh.
      - name: Kiểm luật kiến trúc
        run: yarn arch:probe

      # DATABASE_URL_TEST chỉ có ở repo chính — PR từ fork không nhận được
      # secret (đúng cơ chế bảo mật của GitHub Actions cho repo public), nên
      # bước này TỰ BỎ QUA thay vì đỏ CI của người khác.
      - name: Test tích hợp (cần DATABASE_URL_TEST)
        if: ${{ env.DATABASE_URL_TEST != '' }}
        run: yarn test:integration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Build
        run: yarn build
